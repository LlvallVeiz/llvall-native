name: Build Llvall APK

# Builds the native Capacitor Android app and uploads the debug APK.
# Triggered on every push to main and manually (Actions > Run workflow).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36|platform-tools" || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: llvall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
